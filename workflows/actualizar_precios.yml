name: Actualizar precios

on:
  schedule:
    - cron: '0 10 * * *'   # 7am Argentina (UTC-3) = 10am UTC
    - cron: '0 16 * * *'   # 1pm Argentina (UTC-3) = 4pm UTC
  workflow_dispatch:         # También permite correrlo manualmente desde GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120     # Máximo 2 horas

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr scraper
        run: python scraper.py

      - name: Subir productos.json al repositorio
        run: |
          git config user.name "OdontoPrecio Bot"
          git config user.email "bot@odontoprecios.onrender.com"
          git add productos.json historial.json || true
          git diff --staged --quiet || git commit -m "Actualización automática de precios $(date '+%d/%m/%Y %H:%M')"
          git push
