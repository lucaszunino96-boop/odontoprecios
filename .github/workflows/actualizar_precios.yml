name: Actualizar precios

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr scraper
        run: python scraper.py

      - name: Guardar y subir cambios
        run: |
          git config user.name "OdontoPrecio Bot"
          git config user.email "bot@odontoprecios.onrender.com"
          
          # Agregamos todos los archivos generados (productos e historial)
          git add .
          
          # Creamos el paquete con los cambios. Si no hay nada nuevo, no falla.
          git commit -m "Actualización automática de precios: $(date +'%d/%m/%Y')" || exit 0
          
          # Nos aseguramos de estar sincronizados con el servidor
          git pull --rebase origin main
          
          # Subimos los archivos al repositorio
          git push origin main
