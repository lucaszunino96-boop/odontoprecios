name: Actualizar precios
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr scraper
        run: python scraper.py

      - name: Verificar productos.json generado
        run: |
          echo "=== PWD ==="
          pwd
          echo "=== ls -lah ==="
          ls -lah
          echo "=== productos.json existe? ==="
          if [ ! -f productos.json ]; then
            echo "ERROR: productos.json no fue generado"
            exit 1
          fi
          echo "=== primeros 200 chars del JSON ==="
          head -c 200 productos.json
          echo ""
          echo "=== formato del JSON ==="
          python3 -c "
          import json
          d = json.load(open('productos.json'))
          print('tipo raiz:', type(d).__name__)
          if isinstance(d, dict):
              print('claves:', list(d.keys()))
              prods = d.get('productos', [])
              meta = d.get('meta', {})
              print('meta:', meta)
          else:
              prods = d
              print('formato: lista directa')
          print('total productos:', len(prods))
          if len(prods) < 5000:
              exit(1)
          "

      - name: Mostrar resumen del reporte
        run: |
          if [ -f reporte_scraping.json ]; then
            python3 -c "
          import json
          r = json.load(open('reporte_scraping.json'))
          print(f'Total: {r[\"total_productos\"]} productos en {r[\"duracion_total_s\"]}s')
          for t in r['tiendas']:
              icon = {'ok':'OK','bajo':'BAJO','sin_productos':'SIN PRODS','error_fatal':'ERROR','cobertura_baja':'COB BAJA'}.get(t['estado'],'?')
              print(f'{icon} {t[\"nombre\"]}: {t[\"productos\"]} prods ({t[\"estado\"]})')
            "
          fi

      - name: Diagnostico git antes del commit
        run: |
          echo "=== git status ==="
          git status
          echo "=== git diff --stat HEAD ==="
          git diff --stat HEAD
          echo "=== .gitignore ==="
          cat .gitignore 2>/dev/null || echo "(no existe .gitignore)"
          echo "=== ls -lah productos.json ==="
          ls -lah productos.json
          echo "=== git ls-files productos.json ==="
          git ls-files productos.json

      - name: Guardar y subir cambios
        run: |
          git config user.name "OdontoPrecio Bot"
          git config user.email "bot@odontoprecios.onrender.com"
          echo "=== Archivos antes del add ==="
          ls -lah productos.json reporte_scraping.json 2>/dev/null || true
          echo "=== Verificar assume-unchanged / skip-worktree ==="
          git ls-files -v productos.json
          echo "=== git add (sin suprimir errores) ==="
          git update-index --no-assume-unchanged productos.json 2>/dev/null || true
          git update-index --no-skip-worktree productos.json 2>/dev/null || true
          git add productos.json
          git add reporte_scraping.json 2>/dev/null || true
          git add historial.json 2>/dev/null || true
          echo "=== Resultado del add ==="
          git status
          echo "=== git diff --cached --stat ==="
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "Sin cambios detectados"
            exit 0
          fi
          git commit -m "Actualizacion automatica de precios: $(date +'%d/%m/%Y %H:%M')"
          git push --force-with-lease origin main
          echo "Push exitoso a GitHub"

      - name: Trigger Render deploy
        if: success()
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK")
            if [ "$RESPONSE" = "200" ] || [ "$RESPONSE" = "201" ]; then
              echo "Render deploy triggereado (HTTP $RESPONSE)"
            else
              echo "Render respondio HTTP $RESPONSE"
            fi
          else
            echo "RENDER_DEPLOY_HOOK no configurado"
          fi
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
