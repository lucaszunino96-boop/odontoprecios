name: Actualizar precios
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr scraper
        run: python scraper.py

      - name: Verificar productos.json generado
        run: |
          if [ ! -f productos.json ]; then
            echo "❌ ERROR: productos.json no fue generado"
            exit 1
          fi
          COUNT=$(python3 -c "import json; d=json.load(open('productos.json')); print(len(d['productos']) if isinstance(d, dict) and 'productos' in d else len(d))")
          SIZE=$(wc -c < productos.json)
          echo "✅ productos.json: ${COUNT} productos, ${SIZE} bytes"
          if [ "$COUNT" -lt 5000 ]; then
            echo "❌ ALERTA: menos de 5000 productos"
            exit 1
          fi

      - name: Mostrar resumen del reporte
        run: |
          if [ -f reporte_scraping.json ]; then
            python3 -c "
          import json
          r = json.load(open('reporte_scraping.json'))
          print(f'Total: {r[\"total_productos\"]} productos en {r[\"duracion_total_s\"]}s')
          for t in r['tiendas']:
              icon = {'ok':'✅','bajo':'⚠','sin_productos':'❌','error_fatal':'💥','cobertura_baja':'⚠'}.get(t['estado'],'?')
              print(f'{icon} {t[\"nombre\"]}: {t[\"productos\"]} prods ({t[\"estado\"]})')
            "
          fi

      - name: Guardar y subir cambios
        run: |
          git config user.name "OdontoPrecio Bot"
          git config user.email "bot@odontoprecios.onrender.com"
          git add productos.json reporte_scraping.json historial.json 2>/dev/null || true
          git diff --cached --quiet && echo "Sin cambios detectados." && exit 0
          git commit -m "Actualizacion automatica de precios: $(date +'%d/%m/%Y %H:%M')"
          git push --force-with-lease origin main
          echo "✅ Push exitoso a GitHub"

      - name: Trigger Render deploy
        if: success()
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK")
            if [ "$RESPONSE" = "200" ] || [ "$RESPONSE" = "201" ]; then
              echo "✅ Render deploy triggereado (HTTP $RESPONSE)"
            else
              echo "⚠ Render respondió HTTP $RESPONSE"
            fi
          else
            echo "⚠ RENDER_DEPLOY_HOOK no configurado"
          fi
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
